[package]
name = "redtab"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "Terminal Reddit reader with tabs and direct guest access"
license = "MIT"
repository = "https://github.com/kapral18/redtab"
publish = false

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
libc = "0.2"
crossterm = "0.29"
flate2 = "1"
gif = "0.14"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
nucleo-matcher = "0.3"
parking_lot = "0.12"
ratatui = "0.30"
ratatui-image = { version = "11", default-features = false, features = ["crossterm", "image-defaults"] }
scraper = "0.27"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "1"
unicode-segmentation = "1"
unicode-width = "0.2"
textwrap = "0.16"
signal-hook = "0.4"
ureq = "3"
url = "2"
tiny_http = "0.12"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
uuid = { version = "1", features = ["v4"] }
wreq = { version = "=6.0.0-rc.28", features = ["json", "gzip", "brotli", "deflate", "zstd"] }
wreq-util = "=3.0.0-rc.10"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
