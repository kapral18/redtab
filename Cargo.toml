[package]
name = "redtab"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "Terminal Reddit reader with tabs and browser-session sign-in"
license = "MIT"
repository = "https://github.com/kapral18/redtab"
readme = "README.md"
keywords = ["reddit", "tui", "terminal", "ratatui", "cli"]
categories = ["command-line-utilities"]
exclude = [".github/", "cliff.toml", "deny.toml", "docs/"]

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
libc = "0.2"
crossterm = "0.29"
gif = "0.14"
html5ever = "0.39"
httparse = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
nucleo-matcher = "0.3"
parking_lot = "0.12"
pulldown-cmark = { version = "0.13.5", default-features = false, features = ["html"] }
ratatui = "0.30"
ratatui-image = { version = "11", default-features = false, features = ["crossterm"] }
scraper = "0.27"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "1"
toml_edit = "0.25"
unicode-segmentation = "1"
unicode-width = "0.2"
textwrap = "0.16"
signal-hook = "0.4"
ureq = "3"
url = "2"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
uuid = { version = "1", features = ["v4"] }
wreq = { version = "=6.0.0-rc.28", features = ["json", "gzip", "brotli", "deflate", "zstd"] }
wreq-util = "=3.0.0-rc.10"

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
rookie-cookies = { version = "=0.6.0", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "3.7", default-features = false }
aes = "0.8"
cbc = "0.1"
pbkdf2 = "0.12"
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }
sha1 = "0.10"
zeroize = "1"

[dev-dependencies]
bytes = "1.12"
http = "1.5"
http-body = "1.1"
tokio = { version = "1", features = ["sync"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
