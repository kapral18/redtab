version: 2
updates:
  # Workflow actions stay pinned to commit SHAs; bump them weekly in one PR.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    # gh aw compile owns the pins in its generated *.lock.yml files.
    exclude-paths:
      - ".github/workflows/*.lock.yml"
    ignore:
      - dependency-name: "github/gh-aw-actions/*" # Managed by gh aw compile. Version-locked to the gh-aw compiler; do not bump.
    commit-message:
      prefix: ci
      include: scope

  # Only security updates for crates: they ship as a patch release.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: fix
      include: scope
