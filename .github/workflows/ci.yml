name: CI

on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26]
        task: [test, clippy, msrv]
    name: ${{ matrix.task }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install Linux build prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake clang libclang-dev pkg-config
      - name: Install macOS build prerequisites
        if: runner.os == 'macOS'
        run: brew list cmake >/dev/null 2>&1 || brew install cmake
      - name: Install Rust
        env:
          TOOLCHAIN: ${{ matrix.task == 'msrv' && '1.90.0' || 'stable' }}
        run: |
          if [ "$TOOLCHAIN" = stable ]; then
            rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          else
            rustup toolchain install "$TOOLCHAIN" --profile minimal
          fi
          rustup default "$TOOLCHAIN"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          key: ${{ matrix.task }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - if: matrix.task == 'test'
        run: cargo test --locked --all-targets
      - if: matrix.task == 'clippy' && runner.os == 'Linux'
        run: cargo fmt --check
      - if: matrix.task == 'clippy'
        run: cargo clippy --locked --all-targets -- -D warnings
      - if: matrix.task == 'msrv'
        run: cargo check --locked --all-targets

  dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25
        with:
          command: check advisories bans licenses sources
