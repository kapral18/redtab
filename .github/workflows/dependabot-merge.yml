name: Dependabot merge

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions: {}

jobs:
  merge:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      startsWith(github.event.workflow_run.head_branch, 'dependabot/')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Merge unless it is a major update, then release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.workflow_run.pull_requests[0].number }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          MESSAGE: ${{ github.event.workflow_run.head_commit.message }}
        run: |
          # Merge only when every updated dependency is a minor or patch update.
          deps=$(printf '%s\n' "$MESSAGE" | grep -c 'dependency-name:' || true)
          safe=$(printf '%s\n' "$MESSAGE" | grep -cE 'update-type: version-update:semver-(minor|patch)' || true)
          if [ "$deps" -eq 0 ] || [ "$safe" -ne "$deps" ]; then
            echo "::notice::Major or unknown update: left open for review"
            exit 0
          fi
          if [ -z "$PR" ]; then
            echo "::notice::The CI run has no pull request in this repository"
            exit 0
          fi
          author=$(gh pr view "$PR" --repo "$REPO" --json author,state --jq 'select(.state == "OPEN") | .author.login')
          if [ "$author" != "app/dependabot" ]; then
            echo "::notice::Pull request #$PR is not an open Dependabot pull request"
            exit 0
          fi
          gh pr merge "$PR" --repo "$REPO" --squash --match-head-commit "$SHA"
          # A merge made with GITHUB_TOKEN starts no push workflows; dispatch the release.
          gh workflow run release.yml --repo "$REPO" --ref main
