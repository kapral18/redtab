name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  ci:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  plan:
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.next.outputs.version }}
      tag: ${{ steps.next.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68
        with:
          tool: git-cliff@2.14.2
      - name: Next version from commits since the last tag
        id: next
        run: |
          last=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' --exclude '*-*')
          next=$(git-cliff --bumped-version)
          if [ "$next" = "$last" ]; then
            echo "::notice::No feat, fix, perf or breaking commit since $last; nothing to release"
            exit 0
          fi
          echo "version=${next#v}" >> "$GITHUB_OUTPUT"
          echo "tag=$next" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    if: needs.plan.outputs.version != ''
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: macos-26
            target: aarch64-apple-darwin
            test: false
          - os: macos-26-intel
            target: x86_64-apple-darwin
            test: true
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            test: false
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            test: true
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Linux build prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake clang libclang-dev pkg-config
      - name: Install macOS build prerequisites
        if: runner.os == 'macOS'
        run: brew list cmake >/dev/null 2>&1 || brew install cmake
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          key: ${{ matrix.target }}
      - name: Set version
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          awk -v v="$VERSION" '!done && /^version = "/ { $0 = "version = \"" v "\""; done = 1 } 1' Cargo.toml > Cargo.toml.new
          mv Cargo.toml.new Cargo.toml
          cargo +stable update --workspace
      - name: Test the targets CI does not cover
        if: matrix.test
        env:
          CARGO_PROFILE_DEV_DEBUG: 0
          CARGO_PROFILE_TEST_DEBUG: 0
        run: cargo +stable test --locked --all-targets
      - name: Build
        run: cargo +stable build --release --locked --target ${{ matrix.target }}
      - name: Fetch license texts
        env:
          SPDX_COMMIT: 31846481de7ea17d92f2f46fad76abe58b2e9bb0
        run: |
          mkdir licenses
          while read -r sum id; do
            curl -fsSL --retry 3 -o "licenses/$id.txt" \
              "https://raw.githubusercontent.com/spdx/license-list-data/$SPDX_COMMIT/text/$id.txt"
            echo "$sum  licenses/$id.txt" | shasum -a 256 -c -
          done <<'TEXTS'
          b05785f9f18e6716bab63424b11454513b9943a222595b70411009202fc592b5 MIT
          5a93d5831e1297ab10fe643e1a631e83be392896da14ee2951285a79012df69d BSD-3-Clause
          074e6e32c86a4c0ef8b3ed25b721ca23aca83df277cd88106ef7177c354615ff Apache-2.0
          66a3107d5ad6a058aab753eaac2047ccb2ed0e39465dd0fe5844da3e300d5172 MPL-2.0
          fb981668c18a279e285fc4d83fba1e836cc84dd4daa73c9697d3cfd2d8aca6e0 GPL-3.0-only
          TEXTS
      - name: Package
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.plan.outputs.tag }}
        run: |
          name="redtab-${VERSION}-${TARGET}"
          mkdir "$name"
          cp "target/${TARGET}/release/redtab" LICENSE README.md "$name/"
          cargo metadata --locked --format-version 1 --filter-platform "$TARGET" \
            | jq -r '.packages[] | select(.source != null) | [.manifest_path, .name, .version, (.license // "see license file"), (.authors | join(", ")), (.repository // "crates.io")] | join("\u001f")' \
            | sort -u \
            | while IFS=$'\x1f' read -r manifest crate version license authors repository; do
                test -f "$manifest"
                dir=$(dirname "$manifest")
                printf '\n=== %s %s (%s)\nAuthors: %s\nSource: %s\n' "$crate" "$version" "$license" "$authors" "$repository"
                found=0
                for file in "$dir"/LICENSE* "$dir"/LICENCE* "$dir"/COPYING* "$dir"/NOTICE*; do
                  if [ -f "$file" ]; then
                    found=1
                    printf -- '--- %s\n' "$(basename "$file")"
                    cat "$file"
                  fi
                done
                if [ "$found" = 0 ]; then
                  for id in $(printf '%s' "$license" | tr '()/' '   '); do
                    if [ -f "licenses/$id.txt" ]; then
                      printf -- '--- %s (crate ships no license file)\n' "$id"
                      cat "licenses/$id.txt"
                    fi
                  done
                fi
              done > "$name/THIRD_PARTY_LICENSES"
          printf '\n=== GNU GPL 3.0 (required by LGPL-3.0 section 4 for wreq-util)\n' >> "$name/THIRD_PARTY_LICENSES"
          cat licenses/GPL-3.0-only.txt >> "$name/THIRD_PARTY_LICENSES"
          test -s "$name/THIRD_PARTY_LICENSES"
          tar -czf "$name.tar.gz" "$name"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ matrix.target }}
          path: redtab-*.tar.gz
          if-no-files-found: error

  release:
    needs: [plan, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    outputs:
      released: ${{ steps.tag.outputs.released }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68
        with:
          tool: git-cliff@2.14.2
      - name: Push release commit and tag
        id: tag
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            if [ "$(git rev-parse "$TAG^{commit}^")" != "$GITHUB_SHA" ]; then
              echo "::notice::$TAG was released from another commit; nothing to do"
              exit 0
            fi
            git checkout -q "$TAG"
          else
            awk -v v="$VERSION" '!done && /^version = "/ { $0 = "version = \"" v "\""; done = 1 } 1' Cargo.toml > Cargo.toml.new
            mv Cargo.toml.new Cargo.toml
            cargo update --workspace
            git-cliff --tag "$TAG" --output CHANGELOG.md
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Cargo.toml Cargo.lock CHANGELOG.md
            git commit -m "chore(release): $TAG"
            git tag "$TAG"
            if ! git push --atomic origin HEAD:main "refs/tags/$TAG"; then
              main=$(git ls-remote origin refs/heads/main | cut -f1)
              if [ -n "$main" ] && [ "$main" != "$GITHUB_SHA" ]; then
                echo "::notice::main moved after this run started; the run for the newer push releases it"
                exit 0
              fi
              echo "::error::Pushing the release commit and $TAG failed"
              exit 1
            fi
          fi
          echo "released=true" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        if: steps.tag.outputs.released == 'true'
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        if: steps.tag.outputs.released == 'true'
        working-directory: dist
        run: sha256sum redtab-*.tar.gz > SHA256SUMS
      - name: Find the GitHub release
        id: state
        if: steps.tag.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          if ! release=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft \
            --jq .isDraft 2>/dev/null); then
            echo "state=missing" >> "$GITHUB_OUTPUT"
          elif [ "$release" = true ]; then
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes
            echo "state=missing" >> "$GITHUB_OUTPUT"
          else
            echo "state=complete" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        if: steps.state.outputs.state == 'missing'
        with:
          subject-path: dist/redtab-*.tar.gz
      - name: Publish GitHub release
        if: steps.state.outputs.state == 'missing'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          latest=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>/dev/null || true)
          if [ -z "$latest" ] || [ "$(printf '%s\n%s\n' "${latest#v}" "${TAG#v}" | sort -V | tail -1)" = "${TAG#v}" ]; then
            latest_flag=--latest
          else
            latest_flag=--latest=false
          fi
          git-cliff --current --strip all > notes.md
          gh release create "$TAG" dist/redtab-*.tar.gz dist/SHA256SUMS --repo "$GITHUB_REPOSITORY" \
            --verify-tag --title "$TAG" --notes-file notes.md "$latest_flag"

  crate:
    needs: [plan, release]
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-24.04
    environment: release
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.plan.outputs.tag }}
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - name: Check crates.io
        id: published
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          status=$(curl -s --retry 3 -o /dev/null -w '%{http_code}' -A "redtab-release ($GITHUB_REPOSITORY)" \
            "https://crates.io/api/v1/crates/redtab/$VERSION")
          case "$status" in
            200) echo "done=true" >> "$GITHUB_OUTPUT" ;;
            404) echo "done=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::crates.io returned HTTP $status"; exit 1 ;;
          esac
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9
        if: steps.published.outputs.done == 'false'
        id: auth
      - name: Publish crate
        if: steps.published.outputs.done == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo +stable publish --locked --no-verify

  homebrew:
    needs: [plan, release]
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-24.04
    environment: release
    timeout-minutes: 10
    steps:
      - name: Download checksums
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: kapral18/homebrew-tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_KEY }}
          path: tap
      - name: Update formula
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          current=$(grep -oE '/releases/download/v[^/]+/' tap/Formula/redtab.rb | head -1 | sed -E 's#.*/v([^/]+)/#\1#' || true)
          if [ -n "$current" ] && [ "$(printf '%s\n%s\n' "$current" "${TAG#v}" | sort -V | tail -1)" != "${TAG#v}" ]; then
            echo "::warning::The tap already has redtab $current, newer than ${TAG#v}; leaving it"
            exit 0
          fi
          sum() { awk -v f="redtab-$TAG-$1.tar.gz" '$2 == f { print $1 }' SHA256SUMS | grep .; }
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/redtab-$TAG"
          mac_arm=$(sum aarch64-apple-darwin)
          mac_intel=$(sum x86_64-apple-darwin)
          linux_arm=$(sum aarch64-unknown-linux-gnu)
          linux_intel=$(sum x86_64-unknown-linux-gnu)
          cat > tap/Formula/redtab.rb <<RUBY
          class Redtab < Formula
            desc "Terminal Reddit reader with tabs and browser-session sign-in"
            homepage "https://github.com/$GITHUB_REPOSITORY"
            license "MIT"

            on_macos do
              on_arm do
                url "$url-aarch64-apple-darwin.tar.gz"
                sha256 "$mac_arm"
              end
              on_intel do
                url "$url-x86_64-apple-darwin.tar.gz"
                sha256 "$mac_intel"
              end
            end

            on_linux do
              on_arm do
                url "$url-aarch64-unknown-linux-gnu.tar.gz"
                sha256 "$linux_arm"
              end
              on_intel do
                url "$url-x86_64-unknown-linux-gnu.tar.gz"
                sha256 "$linux_intel"
              end
            end

            def install
              bin.install "redtab"
              doc.install "README.md", "THIRD_PARTY_LICENSES"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/redtab --version")
            end
          end
          RUBY
      - name: Push formula
        working-directory: tap
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/redtab.rb
          if ! git diff --cached --quiet; then
            git commit -m "redtab ${TAG#v}"
            git push
          fi
